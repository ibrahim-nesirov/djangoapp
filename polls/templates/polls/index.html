<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Polls</title>
</head>
<body>
    <h1>Son suallar</h1>
    {% if latest_question_list %}
        <ul>
        {% for question in latest_question_list %}
            <li><a href="{% url 'polls:detail' question.id %}">{{ question.question_text }}</a></li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Heç bir sual yoxdur.</p>
    {% endif %}
</body>
</html>
